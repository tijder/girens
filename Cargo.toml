[workspace]
members = [".", "crates/girens-plex", "search-provider"]
resolver = "2"

[workspace.package]
version = "2.0.10"
edition = "2021"
license = "GPL-3.0-or-later"
repository = "https://gitlab.gnome.org/tijder/girens"

[package]
name = "girens"
version.workspace = true
edition.workspace = true
license.workspace = true
repository.workspace = true
description = "Plex client for GNOME"

[dependencies]
girens-plex = { path = "crates/girens-plex" }
gtk = { package = "gtk4", version = "0.11", features = ["v4_16"] }
adw = { package = "libadwaita", version = "0.9", features = ["v1_6"] }
gettext-rs = { version = "0.8", features = ["gettext-system"] }
libmpv2 = { version = "7", features = ["render"] }
libloading = "0.9"
libsecret = "0.9"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
mpris-server = "0.11"
tokio = { version = "1", features = ["rt-multi-thread", "sync", "fs", "macros", "time"] }

[build-dependencies]
pkg-config = "0.3"

[profile.release]
lto = "thin"
codegen-units = 4
