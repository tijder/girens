app-id: nl.g4d.Girens
runtime: org.gnome.Platform
runtime-version: master
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: girens
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=all
  - --filesystem=xdg-run/dconf
  - --filesystem=~/.config/dconf:ro
  - --own-name=org.mpris.MediaPlayer2.Girens
  - --talk-name=ca.desrt.dconf
  - --talk-name=org.freedesktop.secrets
  - --metadata=X-DConf=migrate-path=/nl/g4d/Girens/
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: ffmpeg
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg/examples
    config-opts:
      - --enable-shared
      - --disable-static
      - --enable-gnutls
      - --disable-doc
      - --disable-ffplay
      - --enable-version3
      - --enable-demuxer=dash
      - --enable-libxml2
      - --disable-programs
      - --disable-encoders
      - --disable-muxers
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg
        tag: n9.0.1
        commit: bf1b838f2ab88b4f8fd83443325c782ea0e0f7fa
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dmanpage-build=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Dlibarchive=enabled
      - -Dshaderc=disabled
      - -Dvulkan=disabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv
        tag: v0.41.0
        commit: 41f6a645068483470267271e1d09966ca3b9f413
        x-checker-data:
          type: git
    modules:
      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
            sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
            x-checker-data:
              type: anitya
              project-id: 1560
              stable-only: true
              url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz
        modules:
          - name: fribidi
            cleanup:
              - /bin
              - /include
              - /lib/pkgconfig
              - /lib/*.la
              - /share/man
            sources:
              - type: archive
                url: https://github.com/fribidi/fribidi/releases/download/v1.0.16/fribidi-1.0.16.tar.xz
                sha256: 1b1cde5b235d40479e91be2f0e88a309e3214c8ab470ec8a2744d82a5a9ea05c
                x-checker-data:
                  type: anitya
                  project-id: 857
                  stable-only: true
                  url-template: https://github.com/fribidi/fribidi/releases/download/v$version/fribidi-$version.tar.xz
          - name: libplacebo
            buildsystem: meson
            config-opts:
              - -Dvulkan=enabled
              - -Dshaderc=disabled
            cleanup:
              - /lib/pkgconfig
              - /include
            sources:
              - type: git
                url: https://code.videolan.org/videolan/libplacebo.git
                tag: v7.360.1
                commit: cee9b076f2c63104ccfd497fa79c39a867293ec4
                x-checker-data:
                  type: git
            modules:
              - name: glslang
                buildsystem: cmake-ninja
                builddir: true
                config-opts:
                  - -DBUILD_SHARED_LIBS=ON
                  - -DENABLE_OPT=OFF
                cleanup:
                  - /bin
                  - /lib/cmake
                  - /include
                sources:
                  - type: archive
                    archive-type: tar
                    url: https://github.com/KhronosGroup/glslang/archive/refs/tags/16.5.0.tar.gz
                    sha256: 01af17195fbeb59e39e31e9506de35bb39dfd35807ea0c9a1a99d7d1183ddd45
                    x-checker-data:
                      type: anitya
                      project-id: 205796
                      stable-only: true
                      url-template: https://github.com/KhronosGroup/glslang/archive/refs/tags/$version.tar.gz
  - name: girens
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dbuildtype=debug
      - -Dnetwork_tests=false
    builddir: true
    build-options:
      build-args:
        - --share=network
    sources:
      - type: git
        url: https://gitlab.gnome.org/tijder/girens
