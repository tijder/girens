      - name: websocket-client
        buildsystem: simple
        build-commands:
          - pip3 install --prefix=/app websocket_client-*.whl
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/3e/0e/7b514f6eb4bf518a9af0285c1a78297467b95fd7d1ebab08b41f8889ab2f/websocket_client-1.9.1-py3-none-any.whl
