      - name: tqdm
        buildsystem: simple
        build-commands:
          - pip3 install --prefix=/app tqdm-*.whl
        sources:
          - type: file
            url: https://files.pythonhosted.org/packages/f9/1c/01bfd571a64e7f270e6bab5e33777debe0edc56759233ce84f27dec92d14/tqdm-4.70.0-py3-none-any.whl
