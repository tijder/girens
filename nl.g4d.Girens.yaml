  - name: girens
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dbuildtype=debug
      - -Dnetwork_tests=false
    builddir: true
    sources:
      - type: git
        url: https://gitlab.gnome.org/tijder/girens
