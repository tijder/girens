app-id: nl.g4d.Girens
runtime: org.gnome.Platform
runtime-version: master
sdk: org.gnome.Sdk
sdk-extensions:
  - org.freedesktop.Sdk.Extension.rust-stable
command: girens
build-options:
  append-path: /usr/lib/sdk/rust-stable/bin
finish-args:
  - --share=network
  - --share=ipc
  - --socket=pulseaudio
  - --socket=wayland
  - --socket=fallback-x11
  - --device=dri
  - --own-name=org.mpris.MediaPlayer2.Girens
  - --talk-name=org.freedesktop.secrets
  - --metadata=X-DConf=migrate-path=/nl/g4d/Girens/
cleanup:
  - /include
  - /lib/pkgconfig
  - /man
  - /share/doc
  - /share/gtk-doc
  - /share/man
  - /share/pkgconfig
  - '*.la'
  - '*.a'
modules:
  - name: ffmpeg
    cleanup:
      - /include
      - /lib/pkgconfig
      - /share/ffmpeg
    config-opts:
      - --enable-shared
      - --disable-static
      - --disable-doc
      - --disable-programs
      - --disable-avdevice
      - --disable-encoders
      - --disable-muxers
      - --enable-gnutls
      # The DASH streams of the Plex transcoder.
      - --enable-libxml2
      - --enable-demuxer=dash
      # FFmpeg's own AV1 decoder only works with a GPU that decodes AV1.
      - --enable-libdav1d
    sources:
      - type: git
        url: https://github.com/FFmpeg/FFmpeg
        tag: n9.0.2
        commit: 946fcce07b6dcd0331c8cc609192aeff5e1924f8
        x-checker-data:
          type: git
          tag-pattern: ^n([\d.]+)$
  - name: libmpv
    cleanup:
      - /include
      - /lib/pkgconfig
    buildsystem: meson
    config-opts:
      - -Dbuild-date=false
      - -Dlibmpv=true
      - -Dcplayer=false
      - -Dmanpage-build=disabled
      - -Dcdda=disabled
      - -Ddvbin=disabled
      - -Ddvdnav=disabled
      - -Dlibarchive=disabled
      - -Dshaderc=disabled
      - -Dvulkan=disabled
      # What Girens cannot do without: fail here rather than at run time.
      - -Dgl=enabled
      - -Degl=enabled
      - -Dvaapi=enabled
      - -Dpulse=enabled
      - -Dpipewire=enabled
    sources:
      - type: git
        url: https://github.com/mpv-player/mpv
        tag: v0.42.0
        commit: b0841e8c4d156b8403dc1876c4cbd9011eb583f3
        x-checker-data:
          type: git
    modules:
      - name: libass
        cleanup:
          - /include
          - /lib/*.la
          - /lib/pkgconfig
        config-opts:
          - --disable-static
        sources:
          - type: archive
            url: https://github.com/libass/libass/releases/download/0.17.5/libass-0.17.5.tar.xz
            sha256: 2dca25c0e0c837ddf00b52011b3f82cac1e4ddd3ad018227806b0c2288864acc
            x-checker-data:
              type: anitya
              project-id: 1560
              stable-only: true
              url-template: https://github.com/libass/libass/releases/download/$version/libass-$version.tar.xz
      # mpv renders through OpenGL here, so libplacebo needs no Vulkan and
      # no shader compiler.
      - name: libplacebo
        buildsystem: meson
        config-opts:
          - -Dvulkan=disabled
          - -Dglslang=disabled
          - -Dshaderc=disabled
          - -Ddemos=false
        cleanup:
          - /lib/pkgconfig
          - /include
        sources:
          - type: git
            url: https://code.videolan.org/videolan/libplacebo.git
            tag: v7.387.0
            commit: 275f7dea27924cdd34ab2e6c20e448b6bc4fab65
            x-checker-data:
              type: git
  - name: girens
    buildsystem: meson
    config-opts:
      - --libdir=lib
      - -Dbuildtype=release
      - -Dnetwork_tests=false
    builddir: true
    build-options:
      env:
        # The crates of cargo-sources.json are unpacked here; see
        # build-aux/cargo-sources.py.
        CARGO_HOME: /run/build/girens/cargo
    sources:
      # This checkout, without what earlier builds left in it.
      - type: dir
        path: .
        skip:
          - .flatpak-builder
          - builddir
          - builddir-rust
          - builddir-rust-meson
          - builddir-rust-offline
          - builddir-rust-release
          - flatpak-build-test
          - target
      - cargo-sources.json
